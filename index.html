<!DOCTYPE html><html lang="ko"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>24절기 여행을 떠나요</title>    <style>        body {            font-family: 'Malgun Gothic', sans-serif;            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);            display: flex;            justify-content: center;            align-items: center;            height: 100vh;            margin: 0;        }        .card {            background: white;            padding: 30px;            border-radius: 20px;            box-shadow: 0 10px 25px rgba(0,0,0,0.2);            width: 450px;            text-align: center;        }        h1 { color: #2b7a78; font-size: 26px; }        p { color: #3aafa9; font-size: 18px; line-height: 1.5; }        .btn {            background-color: #3aafa9;            color: white;            border: none;            padding: 12px 20px;            font-size: 18px;            border-radius: 10px;            cursor: pointer;            width: 100%;            margin-top: 15px;            font-weight: bold;        }        .btn:hover { background-color: #2b7a78; }        .option-btn {            background-color: #f4f6f7;            color: #333;            border: 2px solid #3aafa9;            padding: 12px;            font-size: 16px;            border-radius: 10px;            cursor: pointer;            width: 100%;            margin: 8px 0;            text-align: left;            font-weight: bold;        }        .option-btn:hover { background-color: #e2f8f7; }        .hidden { display: none; }        .emoji { font-size: 60px; margin: 10px 0; }        .score-board { font-size: 16px; color: #e67e22; font-weight: bold; margin-bottom: 10px; text-align: left; }    </style></head><body>
    <div class="card">        <!-- 1. 시작 화면 -->        <div id="start-screen">            <div class="emoji">🌱☀️🍂❄️</div>            <h1>24절기 여행을 떠나요</h1>            <p>초등학교 2학년 눈높이에 맞춘<br>재미있는 24절기 퀴즈 대모험!</p>            <button class="btn" onclick="startQuiz()">게임 시작하기! 🚀</button>        </div>
        <!-- 2. 퀴즈 화면 -->        <div id="quiz-screen" class="hidden">            <div id="score-info" class="score-board">문제 1 / 15 | 점수: 0점</div>            <div id="q-emoji" class="emoji">🌱</div>            <p id="q-text" style="color: #333; font-weight: bold; text-align: left;"></p>            <div id="options-box"></div>        </div>
        <!-- 3. 피드백 화면 -->        <div id="feedback-screen" class="hidden">            <div id="fb-icon" class="emoji">⭕</div>            <h2 id="fb-title" style="margin: 10px 0;">정답입니다!</h2>            <p id="fb-text" style="color: #666; font-size: 16px; text-align: left; background: #f9f9f9; padding: 12px; border-radius: 8px;"></p>            <button class="btn" onclick="nextQuestion()">다음 문제로 ➡️</button>        </div>
        <!-- 4. 결과 화면 -->        <div id="result-screen" class="hidden">            <div class="emoji">🏆</div>            <h1>퀴즈 완료! 수고했어요!</h1>            <p id="final-score" style="font-size: 24px; font-weight: bold; color: #2b7a78;"></p>                        <div id="name-box">                <p style="font-size: 15px; color: #333; margin-bottom: 5px;">랭킹에 등록할 이름을 적어주세요!</p>                <input type="text" id="player-name" placeholder="이름 입력" style="width: 80%; padding: 10px; font-size: 16px; border: 2px solid #3aafa9; border-radius: 8px; text-align: center;">                <button class="btn" onclick="saveScore()">랭킹 등록하기 📝</button>            </div>
            <div id="ranking-box" style="text-align: left; margin-top: 15px; font-size: 14px; background: #f4f6f7; padding: 10px; border-radius: 8px;">                <b>🥇 명예의 전당 (TOP 5)</b><br>                <div id="ranking-list">등록된 랭킹이 없습니다.</div>            </div>
            <button class="btn" style="background-color: #7f8c8d;" onclick="restartGame()">다시 하기 🔄</button>        </div>    </div>
    <script>        const quizData = [            { q: "봄이 시작되는 첫 번째 절기로, '봄이 왔다'는 뜻을 가진 절기는?", options: ["입춘", "입하", "입추", "입동"], answer: 0, exp: "입춘(立春)은 봄이 시작되는 날이에요!", emoji: "🌱" },            { q: "겨울잠을 자던 개구리가 깜짝 놀라서 깨어나는 봄의 절기는?", options: ["우수", "경칩", "청명", "곡우"], answer: 1, exp: "경칩(驚蟄)은 날씨가 따뜻해져 동물들이 깨어나는 때예요.", emoji: "🐸" },            { q: "낮과 밤의 길이가 똑같아지는 봄의 절기는?", options: ["춘분", "하지", "추분", "동지"], answer: 0, exp: "춘분(春分)에는 낮과 밤의 길이가 같아요.", emoji: "⚖️" },            { q: "봄이 지나고 드디어 따뜻한 '여름'이 시작되는 절기는?", options: ["입춘", "입하", "입추", "입동"], answer: 1, exp: "입하(立夏)는 여름이 시작되는 절기예요.", emoji: "🌿" },            { q: "일년 중에서 낮이 가장 길고 해가 오래 뜨 있는 절기는?", options: ["동지", "하지", "춘분", "추분"], answer: 1, exp: "하지(夏至)는 낮이 가장 긴 날이에요.", emoji: "🌞" },            { q: "일년 중에서 날씨가 가장 뜨겁고 더운 시기를 뜻하는 절기는?", options: ["경칩", "대한", "대서", "소설"], answer: 2, exp: "대서(大暑)는 큰 더위가 찾아오는 가장 더운 때예요.", emoji: "🍉" },            { q: "여름이 지나고 시원한 '가을'이 시작되는 절기는?", options: ["입춘", "입하", "입추", "입동"], answer: 2, exp: "입추(立秋)는 가을이 시작되는 절기예요.", emoji: "🌾" },            { q: "'모기도 입이 돌아간다'는 더위가 물러가는 가을 절기는?", options: ["처서", "백로", "상강", "소설"], answer: 0, exp: "처서(處暑)가 지나면 아침저녁으로 선선해져요.", emoji: "🍁" },            { q: "풀잎에 하얀 이슬이 맺히기 시작하는 가을 절기는?", options: ["백로", "상강", "우수", "청명"], answer: 0, exp: "백로(白露)에는 이슬이 하얗게 맺혀요.", emoji: "💧" },            { q: "1년 중 가을에 다시 낮과 밤의 길이가 같아지는 절기는?", options: ["춘분", "추분", "하지", "동지"], answer: 1, exp: "추분(秋分)에는 가을 낮과 밤의 길이가 같아요.", emoji: "🍂" },            { q: "하얀 서리가 내리기 시작하는 늦가을 절기는?", options: ["상강", "소설", "대설", "대한"], answer: 0, exp: "상강(霜降)은 서리가 내리는 추운 날이에요.", emoji: "❄️" },            { q: "드디어 추운 '겨울'이 시작되는 절기는?", options: ["입춘", "입하", "입추", "입동"], answer: 3, exp: "입동(立冬)은 겨울이 시작되는 날이에요.", emoji: "⛄" },            { q: "눈이 가장 많이 내린다는 겨울 절기는 무엇일까요?", options: ["소설", "대설", "소한", "대한"], answer: 1, exp: "대설(大雪)은 눈이 많이 내리는 절기예요.", emoji: "🌨️" },            { q: "밤이 가장 길고, 따뜻한 팥죽을 먹는 겨울 절기는?", options: ["하지", "동지", "춘분", "추분"], answer: 1, exp: "동지(冬至)는 밤이 가장 길고 팥죽을 먹어요.", emoji: "🍲" },            { q: "일년 중에서 가장 춥기로 소문난 겨울의 마지막 절기는?", options: ["대한", "소한", "경칩", "우수"], answer: 0, exp: "대한(大寒)은 큰 추위가 찾아오는 겨울의 절정이에요.", emoji: "🧊" }        ];
        let currentIdx = 0;        let score = 0;
        function startQuiz() {            currentIdx = 0;            score = 0;            document.getElementById('start-screen').classList.add('hidden');            document.getElementById('quiz-screen').classList.remove('hidden');            loadQuestion();        }
        function loadQuestion() {            const q = quizData[currentIdx];            document.getElementById('score-info').innerText = `문제 ${currentIdx + 1} / 15 | 점수: ${score}점`;            document.getElementById('q-emoji').innerText = q.emoji;            document.getElementById('q-text').innerText = q.q;

            const box = document.getElementById('options-box');            box.innerHTML = '';            q.options.forEach((opt, idx) => {                const btn = document.createElement('button');                btn.className = 'option-btn';                btn.innerText = `${idx + 1}. ${opt}`;                btn.onclick = () => checkAnswer(idx);                box.appendChild(btn);            });        }

        function checkAnswer(selectedIdx) {            const q = quizData[currentIdx];            document.getElementById('quiz-screen').classList.add('hidden');            document.getElementById('feedback-screen').classList.remove('hidden');

            const icon = document.getElementById('fb-icon');            const title = document.getElementById('fb-title');            const text = document.getElementById('fb-text');

            if (selectedIdx === q.answer) {                score += 10;                icon.innerText = "⭕";                title.innerText = "정답이에요! (+10점)";                title.style.color = "#27ae60";            } else {                icon.innerText = "❌";                title.innerText = `아쉬워요! 정답은 '${q.options[q.answer]}' 이에요.`;                title.style.color = "#c0392b";            }            text.innerText = q.exp;        }

        function nextQuestion() {            currentIdx++;            document.getElementById('feedback-screen').classList.add('hidden');            if (currentIdx < quizData.length) {                document.getElementById('quiz-screen').classList.remove('hidden');                loadQuestion();            } else {                showResult();            }        }

        function showResult() {            document.getElementById('result-screen').classList.remove('hidden');            document.getElementById('final-score').innerText = `내 최종 점수: ${score}점`;            loadRanking();        }

        function saveScore() {            const name = document.getElementById('player-name').value.trim();            if (!name) {                alert("이름을 입력해주세요!");                return;            }            let rankings = JSON.parse(localStorage.getItem('solarRanking') || '[]');            rankings.push({ name: name, score: score });            rankings.sort((a, b) => b.score - a.score);            rankings = rankings.slice(0, 5);            localStorage.setItem('solarRanking', JSON.stringify(rankings));

            document.getElementById('name-box').classList.add('hidden');            loadRanking();        }

        function loadRanking() {            let rankings = JSON.parse(localStorage.getItem('solarRanking') || '[]');            const list = document.getElementById('ranking-list');            if (rankings.length === 0) {                list.innerText = "아직 등록된 랭킹이 없어요.";                return;            }            
            // 수정된 랭킹 출력부 (순위에 따라 메달 아이콘 추가)
            list.innerHTML = rankings.map((r, i) => {
                let medal = '';
                if (i === 0) medal = '🥇 ';
                else if (i === 1) medal = '🥈 ';
                else if (i === 2) medal = '🥉 ';
                else medal = `${i + 1}등: `;
                
                return `${medal}${r.name} (${r.score}점)`;
            }).join('<br>');        }

        function restartGame() {            document.getElementById('result-screen').classList.add('hidden');            document.getElementById('name-box').classList.remove('hidden');            document.getElementById('player-name').value = '';            startQuiz();        }    </script></body></html>
